{% extends "base.html" %}

{% block title %}Analytics — Spendly{% endblock %}

{% block content %}
<section class="analytics-section">
    <div class="analytics-card">
        <div class="analytics-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>

        <span class="analytics-badge">Coming Soon</span>

        <h1 class="analytics-title">Advanced <em>Analytics</em></h1>

        <p class="analytics-text">
            We're working on powerful insights and visualizations to help you
            understand your spending patterns better.
        </p>

        <div class="analytics-dots" aria-hidden="true">
            <span class="analytics-dot"></span>
            <span class="analytics-dot"></span>
            <span class="analytics-dot"></span>
        </div>

        <p class="analytics-note">We're crafting something special</p>

        <span class="analytics-accent-line" aria-hidden="true"></span>
    </div>
</section>
{% endblock %}
