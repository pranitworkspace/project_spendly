{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block content %}

<section class="form-page">
    <div class="form-page-inner">

        <div class="form-page-header">
            <h1 class="form-page-title">Add an expense</h1>
            <p class="form-page-subtitle">Log a new transaction</p>
        </div>

        <div class="form-page-card">
            {% if error %}
            <div class="form-page-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" step="0.01" min="0.01"
                           value="{{ amount }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled{{ ' selected' if not category }}>Select a category</option>
                        {% for c in categories %}
                        <option value="{{ c }}"{{ ' selected' if c == category }}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input" value="{{ expense_date }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input" maxlength="200"
                           value="{{ description }}">
                </div>
                <button type="submit" class="btn-submit">Save expense</button>
            </form>
        </div>

        <p class="form-page-foot">
            <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
        </p>

    </div>
</section>

{% endblock %}
